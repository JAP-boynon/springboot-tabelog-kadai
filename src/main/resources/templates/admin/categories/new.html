<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <!-- meta -->
    <div th:replace="~{fragment :: meta}"></div>

    <title>カテゴリ登録 | 管理者</title>

    <!-- styles -->
    <div th:replace="~{fragment :: styles}"></div>

</head>
<body>

<!-- ヘッダー（管理者ハンバーガーメニュー） -->
<div th:replace="~{fragment :: header}"></div>

<main class="container mt-4">

    <!-- ===== パンくず ===== -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <a th:href="@{/admin}">管理者トップ</a>
            </li>
            <li class="breadcrumb-item">
                <a th:href="@{/admin/categories}">カテゴリ一覧</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">
                カテゴリ登録
            </li>
        </ol>
    </nav>

    <!-- ===== タイトル ===== -->
    <h2 class="mb-4">カテゴリ登録</h2>

    <!-- ===== 登録フォーム ===== -->
    <form th:action="@{/admin/categories}" method="post" class="col-md-6">

        <div class="mb-3">
            <label for="name" class="form-label">カテゴリ名</label>
            <input type="text"
                   id="name"
                   name="name"
                   class="form-control"
                   placeholder="例：ラーメン"
                   required>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                登録
            </button>
            <a th:href="@{/admin/categories}" class="btn btn-secondary ms-2">
                戻る
            </a>
        </div>

    </form>

</main>

<!-- フッター -->
<div th:replace="~{fragment :: footer}"></div>

<!-- scripts -->
<div th:replace="~{fragment :: scripts}"></div>

</body>
</html>
