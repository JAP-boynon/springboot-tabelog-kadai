<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragment :: meta}"></div>
    <div th:replace="~{fragment :: styles}"></div>
    <title>お支払い方法</title>
</head>

<body>
<div th:replace="~{fragment :: header}"></div>

<main class="container mt-5">

   <!-- パンくず -->
    <nav class="mb-4" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <a th:href="@{/}">ホーム</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">
                クレジットカード情報
            </li>
        </ol>
    </nav>

  <!-- クレカ登録済み -->
  <!--
  <div th:if="${paymentMethod != null}" class="card p-4 mb-4">
	  -->
<div th:if="${paymentMethod != null and paymentMethod.card != null}" 
     class="card p-4 mb-4">
    <p><strong>カード種別：</strong>
      <span th:text="${paymentMethod.card.brand}">visa</span>
    </p>

    <p><strong>カード名義人：</strong>
      <span th:text="${paymentMethod.billingDetails.name}">TARO</span>
    </p>

    <p><strong>カード番号：</strong>
      **** **** ****
      <span th:text="${paymentMethod.card.last4}">4242</span>
    </p>

    <a th:href="@{/payment/method}" class="btn btn-outline-primary mt-3">
      クレジットカード情報を変更
    </a>
  </div>

  <!-- 未登録 -->
  <div th:if="${paymentMethod == null or paymentMethod.card == null}"
     class="alert alert-warning">
    クレジットカードが登録されていません。
    <br>
    <a th:href="@{/payment/method}" class="btn btn-primary mt-3">
      クレジットカードを登録する
    </a>
  </div>

</main>

<div th:replace="~{fragment :: footer}"></div>
<div th:replace="~{fragment :: scripts}"></div>


</body>
</html>
